# Default job used by `python run.py`.

initial_capital: 1000000
fill_on: next_open          # next_open | next_close
delay_bars: 0               # extra bars after T+1 inherent delay
slippage_type: percent      # percent | ticks | volume | vol_adjusted
slippage_value: 0.0005      # 5 bps baseline
tick_size: 0.001
commission_rate: 0.0        # prefer fee_matrix profiles below
lot_size: 100               # A-share ETF board lot; crypto examples override to 0
fee_profile: ashare_etf     # ashare_stock | ashare_etf | gate_perp | zero

etf:
  symbols:
    - "510300"              # 沪深300ETF
    - "510500"              # 中证500ETF
  start: "2019-01-01"
  end: null
  fast: 20
  slow: 60
  ma_type: sma              # sma | ema
  side: long_only           # long_only | long_short

crypto:
  symbol: BTC_USDT
  interval: 1d
  start: "2019-01-01"
  fast: 12
  slow: 26
  ma_type: ema
  side: long_only
  lot_size: 0
  tick_size: 0.01
  initial_capital: 10000
  fee_profile: gate_perp
